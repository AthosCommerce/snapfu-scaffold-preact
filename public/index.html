<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>snApp</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// default to a wildcard "*" query so the dev harness shows results out of the box,
			// but only when the page was loaded without one already
			(function () {
				if (typeof URLSearchParams === 'undefined' || !window.history || !window.history.replaceState) return;

				var params = new URLSearchParams(window.location.search);
				if (!params.has('q')) {
					params.set('q', '*');
					window.history.replaceState(null, '', window.location.pathname + '?' + params.toString() + window.location.hash);
				}
			})();
		</script>
		<script src="bundle.js" id="athos-context"></script>
		<style>
			/* dev harness mockup styles - not part of the bundle */
			#athos-header,
			.athos-layout {
				box-sizing: border-box;
				color: #222;
				max-width: 1200px;
				margin: 0 auto;
				padding: 0 20px;
			}

			#athos-header *,
			.athos-layout * {
				box-sizing: border-box;
			}

			/* search form */
			form {
				display: flex;
				max-width: 1200px;
				margin: 20px auto;
				position: relative;
			}

			form #search-input {
				flex: 1;
				padding: 10px 14px;
				font-size: 1em;
				border: 1px solid #ccc;
				border-radius: 4px;
			}

			form .ss__autocomplete {
				left: 0;
				top: 40px;
				max-width: 800px;
			}

			/* content + sidebar layout */
			.athos-layout {
				display: flex;
				align-items: flex-start;
				gap: 32px;
				padding-bottom: 40px;
			}

			.athos-layout #athos-sidebar {
				flex: 0 0 240px;
				width: 240px;
			}

			.athos-layout #athos-content {
				flex: 1;
				min-width: 0;
			}

			@media (max-width: 767px) {
				.athos-layout {
					flex-direction: column;
				}

				.athos-layout #athos-sidebar {
					display: none;
				}
			}
		</style>
	</head>
	<body>
		<form action="">
			<input id="search-input" type="text" name="q"/>
		</form>
		<div id="athos-header"></div>
		<div class="athos-layout">
			<div id="athos-sidebar"></div>
			<div id="athos-content"></div>
		</div>
	</body>
</html>
